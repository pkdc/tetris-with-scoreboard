<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts - Retro Game Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/favicon-64.png" type="image/png" sizes="64x64">
    <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/assets/favicon-16.png" type="image/png" sizes="16x16">

    <!-- Tailwind CSS v4 -->
    <script type="module" src="https://esm.sh/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            /* Custom colors */
            --color-game-dark: #1A1A2E;
            --color-game-darker: #0F0F1A;
            --color-game-card: #252540;
            --color-game-yellow: #FFD700;
            --color-game-yellow-light: #FFE44D;
            --color-game-yellow-dark: #E5A800;
            --color-game-orange: #FF8C00;
            --color-game-coral: #FF6B6B;
            --color-game-teal: #20B2AA;
            --color-game-blue: #4169E1;
            --color-game-grey: #3A3A5C;

            /* Custom fonts */
            --font-pixel: "Press Start 2P", cursive;
            --font-arcade: "VT323", monospace;
        }
    </style>

    <!-- Custom game styles -->
    <link rel="stylesheet" href="/assets/app.css">

    <title>Tetris</title>
</head>

<body class="bg-game-darker text-white min-h-screen overflow-hidden font-arcade">
    <div id="root" class="w-full h-screen flex items-center justify-center">
        <script type="module" src="/assets/index.js"></script>
    </div>

    <!-- Mobile touch controls (hidden on desktop via CSS) -->
    <div id="touch-controls">
        <div class="dpad">
            <div class="dpad-row">
                <div></div><div></div><div></div>
            </div>
            <div class="dpad-row">
                <button id="btn-left" class="dpad-btn" type="button" aria-label="Move left">◀</button>
                <button id="btn-down" class="dpad-btn dpad-drop" type="button" aria-label="Soft drop">▼</button>
                <button id="btn-right" class="dpad-btn" type="button" aria-label="Move right">▶</button>
            </div>
        </div>
        <button id="btn-rotate" class="rotate-btn" type="button" aria-label="Rotate">
            <span>↻</span>
            <small>ROTATE</small>
        </button>
    </div>
</body>
</html>
